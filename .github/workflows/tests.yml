name: Tests and research evidence
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install media and lifecycle tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg lsof
      - name: Install media tools on macOS
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - run: python -m pip install uv==0.9.5
      - run: uv sync --locked --python '${{ matrix.python }}' --no-python-downloads --extra test --extra research
      - name: Required contracts including real wheel installation
        run: uv run --no-sync python tools/run_test_suite.py --output output/validation/tests.json
      - name: Reconcile public research data
        run: uv run --no-sync python tools/render_research_figures.py --check
      - name: Render research figures from public data
        run: uv run --no-sync python tools/render_research_figures.py --output output/validation/figures
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}
          path: output/validation/
          if-no-files-found: error
